services:
  postgres:
    image: postgres:17-alpine
    container_name: healthy-tiffins-db
    environment:
      POSTGRES_USER: tiffins
      POSTGRES_PASSWORD: tiffins
      POSTGRES_DB: tiffins
    ports:
      - '5433:5432'
    volumes:
      - tiffins-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiffins -d tiffins']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tiffins-pgdata:
